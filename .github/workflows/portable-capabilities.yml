name: Portable capability contract

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-capabilities:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install zsh
        run: |
          sudo apt-get update
          sudo apt-get install --yes zsh
      - name: Check script syntax
        run: |
          zsh -n bin/compress-agent-sessions
          zsh -n tests/capabilities.zsh
          zsh -n tests/smoke.zsh
      - name: Test mocked capability contract
        run: zsh tests/capabilities.zsh
