name: CIFAST tier setup
description: Validate the PR/batch boundary and run the repository's pinned setup
inputs:
  tier:
    description: quick for PRs, full for canonical Devkit integration branches
    required: true
  setup-script:
    description: Reviewed repository-relative Bash entrypoint receiving the tier
    required: true
runs:
  using: composite
  steps:
    - name: Validate tier and setup entrypoint
      shell: bash
      env:
        CI_TIER: ${{ inputs.tier }}
        CI_SETUP: ${{ inputs.setup-script }}
      run: |
        set -euo pipefail
        case "$CI_TIER" in
          quick) test "$GITHUB_EVENT_NAME" = pull_request ;;
          full)
            test "$GITHUB_EVENT_NAME" = push
            [[ "$GITHUB_REF" =~ ^refs/heads/batch/[0-9]{8}T[0-9]{6}Z-[0-9a-f]{16}$ ]]
            ;;
          *) echo 'Unknown CI tier' >&2; exit 2 ;;
        esac
        [[ "$CI_SETUP" =~ ^[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)*$ ]]
        case "/$CI_SETUP/" in */../*|*/./*) exit 2 ;; esac
        test -f "$CI_SETUP"
        test ! -L "$CI_SETUP"
    - name: Set up pinned tier toolchain
      shell: bash
      env:
        CI_TIER: ${{ inputs.tier }}
        CI_SETUP: ${{ inputs.setup-script }}
      run: bash -euo pipefail -- "$CI_SETUP" "$CI_TIER"
